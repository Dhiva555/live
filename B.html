  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(120deg, #ffdde1, #ee9ca7);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    .heart-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 40px;
      z-index: 2;
      transition: top 0.8s ease;
    }

    .heart {
      font-size: 70px;
      cursor: pointer;
      animation: fallToCenter 1s ease forwards, float 3s ease-in-out infinite;
      text-align: center;
      opacity: 0;
    }

    .heart span {
      display: block;
      font-size: 16px;
      margin-top: 8px;
      color: #fff;
    }

    /* Staggered delays */
    .heart:nth-child(1) { animation-delay: 0s, 1s; }
    .heart:nth-child(2) { animation-delay: 0.4s, 1s; }
    .heart:nth-child(3) { animation-delay: 0.8s, 1s; }
    .heart:nth-child(4) { animation-delay: 1.2s, 1s; }
    .heart:nth-child(5) { animation-delay: 1.6s, 1s; }

    @keyframes fallToCenter {
      0% {
        transform: translateY(-200px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }

    .glass-box {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      color: white;
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: none;
      z-index: 1;
      min-width: 240px;
      box-shadow: 0 0 25px rgba(255, 105, 180, 0.4);
    }

    /* Falling Confetti */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .heart-particle {
      position: absolute;
      color: rgba(255, 0, 128, 0.7);
      animation: fall linear infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10%) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
